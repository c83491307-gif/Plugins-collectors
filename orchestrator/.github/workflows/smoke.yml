name: Orchestrator Verification
on:
  push:
    paths: ["orchestrator/**"]
  pull_request:
    paths: ["orchestrator/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: orchestrator/package.json
      - run: npm run verify:syntax
      - run: npm run smoke
      - run: npm run provider-stack
      - run: npm run verify:targeted
      - run: npm run verify:stress
