name: Orchestrator Connected Chain
on:
  push:
    paths: ["orchestrator/**", ".github/workflows/**"]
  pull_request:
    paths: ["orchestrator/**"]
  workflow_dispatch:

concurrency:
  group: orchestrator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CEPX_TEST_DATABASE_URL: postgres://cepx:cepx-test-password@localhost:5432/cepx_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cepx
          POSTGRES_PASSWORD: cepx-test-password
          POSTGRES_DB: cepx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cepx -d cepx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: orchestrator/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Version
        run: node --version && npm --version
      - name: Syntax verification
        run: npm run verify:syntax
      - name: Targeted runtime verification
        run: npm run verify:targeted
      - name: Provider runtime verification
        run: npm run provider-stack
      - name: Full smoke chain
        run: npm run smoke
      - name: Stress/account verification
        run: npm run verify:stress
      - name: CEPX continuity engine tests
        run: npm run cepx
